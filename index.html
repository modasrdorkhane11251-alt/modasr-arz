    <script>
      (function() {
        // 1. Intercept console.error to prevent Vite HMR websocket noise from appearing in AI Studio logs
        var origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments[0] ? String(arguments[0]) : '';
          if (
            firstArg.indexOf('[vite]') !== -1 ||
            firstArg.indexOf('WebSocket') !== -1 ||
            firstArg.indexOf('websocket') !== -1
          ) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        // 2. Intercept console.warn for Vite websocket
        var origConsoleWarn = console.warn;
        console.warn = function() {
          var firstArg = arguments[0] ? String(arguments[0]) : '';
          if (
            firstArg.indexOf('[vite]') !== -1 ||
            firstArg.indexOf('WebSocket') !== -1 ||
            firstArg.indexOf('websocket') !== -1
          ) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };

        // 3. Intercept console.debug for [vite] connecting...
        var origConsoleDebug = console.debug;
        console.debug = function() {
          var firstArg = arguments[0] ? String(arguments[0]) : '';
          if (firstArg.indexOf('[vite]') !== -1) {
            return;
          }
          return origConsoleDebug.apply(console, arguments);
        };

        // 4. Suppress unhandledrejection & error events for websocket
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
